<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>TodoTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1 id="main-heading">TO<span style="color: rgb(187, 132, 29);">DO'S</span></h1>
  <hr>
  <div id="form-one">
    <form>
      <h3 class="heading-list" id="personalHeading"><a href="#" class="heading-link" id="personal-link">Personal</a>
      </h3>
      <h3 class="heading-list" id="professionalHeading"><a href="#" class="heading-link">Professional</a>
      </h3>
    </form>
  </div>

  <div class="form-two">
    <form id="todo-form">
      <input type="text" id="user-todo" placeholder="what do you want to add in your Todo?" required>
      <button id="addButton" class="form-fields" type="button"> ADD </button>
    </form>

    <h3 id="todo-header">Here's Your Todo List </h3>

    <div id="todo-list-div">
    <ul id="todo-list">
     
    </ul>

    <div id="button-clear-div">
    <button class="form-fields" id="clear">CLEAR LIST</button>
  </div>
  </div>

  </div>
  
  <script src="script.js"></script>

</body>

</html>
